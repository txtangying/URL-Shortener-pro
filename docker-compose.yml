services:
  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:      # 👈 新增健康检查
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy   # 👈 保证 Redis 健康后才启动 API
    environment:
      - REDIS_HOST=redis
    volumes:
      - .:/app

volumes:
  redis_data: